[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermo-iot-laboratory"
version = "0.1.0"
description = "Energy budget screening toolkit for Thermo-IoT concept"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["thermo_iot*"]
