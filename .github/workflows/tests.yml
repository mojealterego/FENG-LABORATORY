name: unit-tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python package
        run: python -m compileall -q thermo_iot
      - name: C11 codec - warnings as errors
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/include firmware/src/thermo_iot_frame.c \
            firmware/tests/test_frame.c -o /tmp/thermo_iot_frame_tests
          /tmp/thermo_iot_frame_tests
      - name: Cross-compile freestanding Cortex-M4 application objects
        run: |
          mkdir -p /tmp/thermo-iot-arm
          for source in firmware/src/thermo_iot_frame.c firmware/src/thermo_iot_power_policy.c firmware/src/thermo_iot_app.c; do
            name="$(basename "$source" .c)"
            clang --target=arm-none-eabi -mcpu=cortex-m4 -mthumb -std=c11 -ffreestanding \
              -Wall -Wextra -Werror -pedantic -Ifirmware/include -c "$source" \
              -o "/tmp/thermo-iot-arm/${name}.o"
            file "/tmp/thermo-iot-arm/${name}.o"
          done
      - name: C11 STM32WLE5 application host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Ifirmware/include \
            firmware/src/thermo_iot_app.c firmware/src/thermo_iot_power_policy.c \
            firmware/src/thermo_iot_frame.c firmware/tests/test_app.c -o /tmp/thermo_iot_app_tests
          /tmp/thermo_iot_app_tests
      - name: C11 power-management policy host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/include firmware/src/thermo_iot_power_policy.c \
            firmware/tests/test_power_policy.c -o /tmp/thermo_iot_power_policy_tests
          /tmp/thermo_iot_power_policy_tests
      - name: Check dashboard JavaScript syntax
        run: node --check thermo_iot/static/app.js
      - name: Populate local demonstration database
        run: python -m thermo_iot.demo --db /tmp/thermo-iot-synthetic-ci.sqlite --count 36
      - name: KiCad source consistency smoke
        run: python -m unittest discover -s tests -p "test_kicad_source.py" -v
      - name: Reference RF supply MUST remain engineering HOLD
        run: |
          python -m thermo_iot.power_gate > /tmp/thermo-iot-power-hold.json
          python - <<'PY'
          import json
          from thermo_iot.harvester_rail import RailAssumptions, evaluate_hold_up
          from thermo_iot.power_gate import screen_reference_power, candidate_supply
          conservative=screen_reference_power(candidate_supply())
          optimistic=evaluate_hold_up(RailAssumptions(
              output_capacitance_f=470e-6,pmic_current_a=0.0045,
              cap_esr_ohm=0.15))
          with open('/tmp/thermo-iot-power-hold.json') as src:
              report=json.load(src)
          assert report['decision']=='HOLD' and not report['deployment_authorized']
          assert conservative['decision']=='HOLD'
          assert optimistic['status']=='NO_GO'
          assert not optimistic['physical_validation_performed']
          print('RF SUPPLY HOLD confirmed by independent candidate equations; NO real hardware qualification')
          PY
      - name: Energy model smoke
        run: python -m thermo_iot --teg-mw 0.1
      - name: TTN fixture smoke
        run: |
          python -m thermo_iot.gateway ingest --db /tmp/thermo-iot-smoke.sqlite --file examples/ttn_v3_uplink.json
          python -m thermo_iot.gateway report --db /tmp/thermo-iot-smoke.sqlite --app district-heat --device pipe-1
      - name: Time-series energy simulation smoke
        run: python -m thermo_iot.trace --file examples/synthetic_teg_trace.csv --period-s 600
      - name: Synthetic metrology smoke
        run: python -m thermo_iot.lab --file examples/synthetic_teg_sweep.csv
