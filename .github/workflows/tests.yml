name: unit-tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q thermo_iot
      - name: CLI smoke
        run: python -m thermo_iot --teg-mw 0.1
