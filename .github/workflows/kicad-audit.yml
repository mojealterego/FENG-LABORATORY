name: KiCad EDA audit
on:
  push:
    branches: [main]
    paths:
      - "hardware/**"
      - ".github/workflows/kicad-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source KiCad CLI
        run: |
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Inspect schematic export and ERC for all projects
        shell: bash
        run: |
          mkdir -p cad-reports
          set +e
          for project in hardware/kicad/thermo_bench_carrier hardware/active_power/ltc3108_power_breakout; do
            label="$(basename "$project")"
            echo "::group::Schematic audit $label"
            kicad-cli sch export netlist -o "cad-reports/${label}.net" "${project}.kicad_sch"
            echo "netlist command result: $?" | tee "cad-reports/${label}-netlist-status.txt"
            kicad-cli sch erc --severity-all --exit-code-violations -o "cad-reports/${label}-erc.txt" "${project}.kicad_sch"
            echo "erc command result: $?" | tee "cad-reports/${label}-erc-status.txt"
            cat "cad-reports/${label}-erc.txt" || true
            echo "::endgroup::"
          done
          for project in hardware/kicad/thermo_bench_carrier hardware/active_power/ltc3108_power_breakout; do
            label="$(basename "$project")"
            echo "::group::PCB audit $label"
            kicad-cli pcb drc --severity-all --exit-code-violations -o "cad-reports/${label}-drc.txt" "${project}.kicad_pcb"
            echo "drc command result: $?" | tee "cad-reports/${label}-drc-status.txt"
            cat "cad-reports/${label}-drc.txt" || true
            echo "::endgroup::"
          done
          # Audit reports do not constitute release approval: all CAD defects
          # must be reviewed and corrected before fabrication.
          exit 0
      - name: Validate KiCad XML pin-to-net contracts
        run: |
          kicad-cli sch export netlist --format kicadxml \
            -o cad-reports/thermo_bench_carrier.xml \
            hardware/kicad/thermo_bench_carrier.kicad_sch
          python3 hardware/verify_kicad_netlist.py --kind carrier \
            --xml cad-reports/thermo_bench_carrier.xml
          kicad-cli sch export netlist --format kicadxml \
            -o cad-reports/ltc3108_power_breakout.xml \
            hardware/active_power/ltc3108_power_breakout.kicad_sch
          python3 hardware/verify_kicad_netlist.py --kind ltc3108 \
            --xml cad-reports/ltc3108_power_breakout.xml
      - name: Prepare preliminary passive-carrier plots (NOT FOR FAB)
        run: |
          set -euo pipefail
          mkdir -p cad-reports/passive-plots
          kicad-cli pcb drc --severity-all --exit-code-violations \
            -o cad-reports/passive-plots/drc.txt \
            hardware/kicad/thermo_bench_carrier.kicad_pcb
          kicad-cli pcb export gerbers \
            --layers F.Cu,B.Cu,F.Mask,B.Mask,F.SilkS,B.SilkS,Edge.Cuts \
            -o cad-reports/passive-plots/ \
            hardware/kicad/thermo_bench_carrier.kicad_pcb
          kicad-cli pcb export drill \
            -o cad-reports/passive-plots/ \
            hardware/kicad/thermo_bench_carrier.kicad_pcb
          printf '%s\n' \
            "PRELIMINARY EXPERIMENTAL ADAPTER ONLY" \
            "NOT RELEASED FOR FABRICATION: symbol ERC, pinout, DFM and physical board bring-up pending." \
            > cad-reports/passive-plots/NOT_FOR_FABRICATION.txt
          test -n "$(find cad-reports/passive-plots -maxdepth 1 -name '*.gtl' -print -quit)"
          test -n "$(find cad-reports/passive-plots -maxdepth 1 -name '*.gbl' -print -quit)"
          test -n "$(find cad-reports/passive-plots -maxdepth 1 -name '*.gm1' -print -quit)"
          test -n "$(find cad-reports/passive-plots -maxdepth 1 -name '*.drl' -print -quit)"
      - name: Classify active and passive PCB (manufacturing HOLD by default)
        run: |
          python3 hardware/cad_gate.py \
            --drc cad-reports/ltc3108_power_breakout-drc.txt \
            | tee cad-reports/ltc3108-power-readiness.json
          python3 hardware/cad_gate.py \
            --drc cad-reports/thermo_bench_carrier-drc.txt \
            | tee cad-reports/passive-carrier-readiness.json
      - name: Surface CAD readiness in GitHub job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Thermo-IoT: EDA validation status"
            echo "These files are CAD candidates, not hardware verified."
            echo ""
            for report in cad-reports/*-status.txt; do
              if [ -f "$report" ]; then
                echo "- $(basename "$report"): $(cat "$report")"
              fi
            done
            echo ""
            echo "Readiness decisions (not fabrication approvals):"
            for file in cad-reports/*-readiness.json; do
              if [ -f "$file" ]; then
                echo "### $(basename "$file")"
                echo '\`\`\`json'
                cat "$file"
                echo '\`\`\`'
              fi
            done
            echo "KiCad error/warning status and unconnected items are retained in the artifact."
            echo "A green diagnostic job does not waive ERC/DRC violations or authorize manufacturing."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-audit-diagnostics
          path: cad-reports/
          if-no-files-found: warn
